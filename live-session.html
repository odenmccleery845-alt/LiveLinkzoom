<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Live Room — LiveLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#160000;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;}

.app{
  position:relative;width:100%;max-width:430px;height:100vh;max-height:932px;
  margin:0 auto;background:#160000;overflow:hidden;
}

/* =========================================================
   SCREEN SWITCHER
   ========================================================= */
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:10;}
.screen.on{display:flex;}

/* =========================================================
   JOIN FORM SCREEN
   ========================================================= */
#joinScreen{
  align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,45,120,0.2),transparent 55%),
    radial-gradient(circle at 70% 80%,rgba(139,92,246,0.25),transparent 55%),
    #0a0a0f;
  overflow-y:auto;
}
.join-card{
  width:100%;max-width:400px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;padding:26px;
  display:flex;flex-direction:column;gap:14px;
}
.invite-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  padding:5px 12px;border-radius:100px;
  font-size:10px;font-weight:900;letter-spacing:1px;
  margin:0 auto 6px;box-shadow:0 0 20px rgba(255,45,120,0.5);
}
.join-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;text-align:center;}
.join-sub{font-size:13px;color:rgba(255,255,255,0.5);text-align:center;font-weight:500;margin-bottom:4px;line-height:1.5;}
.join-sub b{color:#ff2d78;font-weight:800;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.5);}
.field input{
  padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-family:inherit;font-size:15px;
  outline:none;transition:border-color 0.2s;
}
.field input:focus{border-color:#ff2d78;}
.field input.err{border-color:#ef4444;}

.err-msg{font-size:12px;color:#ef4444;font-weight:600;margin-top:2px;display:none;}
.err-msg.on{display:block;}

.btn-primary{
  padding:15px;border-radius:100px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:15px;font-weight:800;letter-spacing:0.3px;
  cursor:pointer;box-shadow:0 8px 28px rgba(255,45,120,0.4);
  transition:transform 0.15s;margin-top:6px;
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

/* =========================================================
   LIVE ROOM SCREEN
   ========================================================= */
#liveScreen{background:#160000;}

/* ---- LAYER 5 — HOST VIDEO ---- */
.layer-video{
  position:absolute;inset:0;z-index:5;
  background:radial-gradient(circle at 50% 40%,rgba(255,45,120,0.15),transparent 65%),
             linear-gradient(160deg,#1a0010,#160000 60%,#0a0000 100%);
  overflow:hidden;
}
.host-img{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  max-width:100%;max-height:100%;
  object-fit:contain;will-change:transform;
}
.host-img.bob{animation:bob 3.6s ease-in-out infinite;}
@keyframes bob{
  0%,100%{transform:translate(-50%,-50%) rotate(0deg);}
  25%  {transform:translate(-50%,calc(-50% - 3px)) rotate(-0.4deg);}
  50%  {transform:translate(-50%,-50%) rotate(0deg);}
  75%  {transform:translate(-50%,calc(-50% - 2px)) rotate(0.4deg);}
}
.mouth{
  position:absolute;
  background:radial-gradient(ellipse at center,#0a0202 0%,#1a0505 60%,transparent 100%);
  border-radius:50%;transform-origin:center;opacity:0;
  pointer-events:none;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.95);
  transition:opacity 0.12s;
}
.mouth.on{opacity:1;}
.mouth.talking{animation:mouthTalk 0.13s steps(2,end) infinite;}
@keyframes mouthTalk{
  0%{transform:scaleY(0.15);}
  50%{transform:scaleY(1);}
  100%{transform:scaleY(0.15);}
}
.video-fade{
  position:absolute;left:0;right:0;bottom:0;height:55%;z-index:6;
  background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,0.35) 50%,rgba(0,0,0,0.75) 100%);
  pointer-events:none;
}

/* ---- LAYER 9 — TOP BAR ---- */
.layer-top{
  position:absolute;top:0;left:0;right:0;z-index:9;
  padding:14px 12px;
  padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);
}
.live-badge{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff2d78,#ff5c2d);
  padding:5px 11px;border-radius:100px;
  font-size:11px;font-weight:900;letter-spacing:0.6px;
  box-shadow:0 0 18px rgba(255,45,120,0.65);
}
.live-badge .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.top-right{display:flex;align-items:center;gap:8px;}
.viewers{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:5px 10px;border-radius:100px;
  font-size:11px;font-weight:700;
}
.viewers svg{width:13px;height:13px;fill:#fff;}
.close-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:none;color:#fff;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ---- HOST INFO ---- */
.host-info{
  position:absolute;left:12px;right:110px;bottom:16px;z-index:9;
}
.host-name{
  font-size:19px;font-weight:800;letter-spacing:-0.3px;
  display:flex;align-items:center;gap:6px;
  text-shadow:0 2px 10px rgba(0,0,0,0.95);
  line-height:1.15;
}
.verified{
  width:16px;height:16px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;flex:0 0 16px;
}
.host-meta{
  font-size:12px;color:rgba(255,255,255,0.9);
  margin-top:3px;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}
.host-pitch{
  font-size:12.5px;color:rgba(255,255,255,0.85);
  margin-top:6px;line-height:1.4;font-weight:500;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ---- CAPTION ---- */
.caption{
  position:absolute;left:50%;bottom:70px;transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:18px;
  font-size:13px;font-weight:600;line-height:1.35;
  max-width:calc(100% - 130px);text-align:center;
  opacity:0;transition:opacity 0.25s;z-index:9;
}
.caption.on{opacity:1;}

/* ---- LAYER 10 — CHAT ---- */
.layer-chat{
  position:absolute;left:12px;right:104px;bottom:80px;z-index:10;
  display:flex;flex-direction:column;justify-content:flex-end;
  gap:6px;max-height:36vh;
  mask-image:linear-gradient(to top,transparent 0%,#000 20%);
  -webkit-mask-image:linear-gradient(to top,transparent 0%,#000 20%);
  pointer-events:none;
  overflow:hidden;
}
.msg{
  display:flex;gap:6px;align-items:flex-start;
  animation:msgIn 0.4s ease;
}
.msg .avatar{
  width:26px;height:26px;border-radius:50%;flex:0 0 26px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  text-transform:uppercase;
}
.msg .avatar.admin{background:linear-gradient(135deg,#f59e0b,#ef4444);}
.msg .avatar.host{background:linear-gradient(135deg,#22c55e,#16a34a);}
.msg .body{
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:5px 10px;border-radius:14px;
  font-size:12.5px;line-height:1.35;
  max-width:100%;word-break:break-word;
}
.msg .name{color:#ff8bb8;font-weight:700;margin-right:4px;}
.msg.admin .name{color:#fbbf24;}
.msg.host .name{color:#4ade80;}
.msg.system .body{
  background:rgba(255,45,120,0.2);
  color:#ff8bb8;font-weight:700;font-size:11.5px;
  padding:4px 10px;border-radius:100px;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

/* ---- LAYER 11 — ACTION BAR ---- */
.layer-actions{
  position:absolute;left:0;right:0;bottom:0;z-index:11;
  padding:10px 12px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,0.85) 40%,transparent);
  display:flex;align-items:center;gap:8px;
}
.action-input{
  flex:1;height:40px;border-radius:100px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.08);
  color:#fff;font-size:13px;
  padding:0 16px;outline:none;font-family:inherit;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.action-input::placeholder{color:rgba(255,255,255,0.45);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s;position:relative;
}
.icon-btn:active{transform:scale(0.9);}
.icon-btn.gift{background:linear-gradient(135deg,#ff2d78,#8b5cf6);border-color:transparent;box-shadow:0 4px 16px rgba(255,45,120,0.4);}
.icon-btn.gift .badge{
  position:absolute;top:-2px;right:-2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;color:#ff2d78;
  font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #160000;
}

/* ---- ADMIN CONTROL BAR (bottom, above actions) ---- */
.admin-bar{
  display:none;
  position:absolute;left:0;right:0;bottom:62px;z-index:12;
  padding:8px 12px;
  background:linear-gradient(to top,rgba(20,10,0,0.9),rgba(0,0,0,0.5));
  border-top:1px solid rgba(255,45,120,0.2);
  gap:6px;align-items:center;flex-wrap:wrap;
}
.admin-bar.on{display:flex;}
.admin-label{
  font-size:9px;font-weight:900;letter-spacing:1px;
  color:#ff2d78;text-transform:uppercase;
  padding:0 6px 0 2px;
}
.admin-btn{
  padding:7px 12px;border-radius:100px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;
  transition:background 0.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.admin-btn:hover{background:rgba(255,45,120,0.2);border-color:rgba(255,45,120,0.4);}
.admin-btn.speak{background:linear-gradient(135deg,#ff2d78,#8b5cf6);border-color:transparent;box-shadow:0 4px 12px rgba(255,45,120,0.35);}
.admin-btn.end{background:rgba(239,68,68,0.2);color:#f87171;border-color:rgba(239,68,68,0.4);}

/* ---- FLOATING GIFTS ---- */
.gift-float{
  position:absolute;font-size:26px;pointer-events:none;z-index:30;
  animation:giftUp 3s ease-out forwards;
  filter:drop-shadow(0 0 6px rgba(255,45,120,0.8));
}
@keyframes giftUp{
  0%{opacity:0;transform:translateY(20px) scale(0.6);}
  20%{opacity:1;transform:translateY(0) scale(1.1);}
  80%{opacity:1;transform:translateY(-140px) scale(1);}
  100%{opacity:0;transform:translateY(-190px) scale(0.9);}
}
.heart-float{
  position:absolute;font-size:22px;pointer-events:none;z-index:30;
  animation:heartUp 1.8s ease-out forwards;
}
@keyframes heartUp{
  0%{opacity:1;transform:translateY(0) scale(0.8);}
  100%{opacity:0;transform:translateY(-180px) scale(1.4);}
}

/* ---- NOTICE OVERLAY (kicked, ended) ---- */
.notice{
  position:absolute;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:rgba(10,0,0,0.95);padding:32px;text-align:center;
}
.notice.on{display:flex;}
.notice-icon{font-size:56px;}
.notice-title{font-size:22px;font-weight:900;letter-spacing:-0.4px;}
.notice-sub{font-size:14px;color:rgba(255,255,255,0.5);max-width:300px;line-height:1.55;}
.notice-btn{
  margin-top:8px;padding:12px 24px;border-radius:100px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;box-shadow:0 6px 20px rgba(255,45,120,0.4);
}

/* ---- LOADING ---- */
.loading{
  position:absolute;inset:0;z-index:70;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;
  background:#160000;color:rgba(255,255,255,0.6);font-size:13px;
}
.loading.on{display:flex;}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:#ff2d78;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- GUESTS BAR (top of chat, shows who's in room) ---- */
.guests-strip{
  position:absolute;top:64px;left:12px;right:12px;z-index:9;
  display:flex;gap:6px;flex-wrap:wrap;
  pointer-events:none;
}
.guest-chip{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:4px 9px;border-radius:100px;
  font-size:10.5px;font-weight:700;color:#fff;
  border:1px solid rgba(255,255,255,0.1);
  animation:chipIn 0.3s ease;
}
.guest-chip.admin{background:rgba(245,158,11,0.3);border-color:rgba(245,158,11,0.5);}
@keyframes chipIn{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- =========================================================
       SCREEN 1 — JOIN FORM
       ========================================================= -->
  <div class="screen on" id="joinScreen">
    <div class="join-card">
      <div class="invite-badge">🔒 INVITE ONLY</div>
      <div class="join-title">You're invited</div>
      <div class="join-sub" id="joinRoomCode">Room: <b>—</b></div>

      <div class="field">
        <label>Full Name</label>
        <input id="jName" placeholder="Enter your full name" autocomplete="name" maxlength="40">
        <div class="err-msg" id="errName">Please enter your full name</div>
      </div>

      <div class="field">
        <label>Age</label>
        <input id="jAge" placeholder="Enter your age" inputmode="numeric" maxlength="3">
        <div class="err-msg" id="errAge">Please enter a valid age</div>
      </div>

      <div class="field">
        <label>Location</label>
        <input id="jLocation" placeholder="Where are you from?" maxlength="40">
        <div class="err-msg" id="errLocation">Please enter your location</div>
      </div>

      <div class="field">
        <label>Passcode</label>
        <input id="jPasscode" placeholder="Enter the room passcode" maxlength="20" autocomplete="off">
        <div class="err-msg" id="errPasscode">Incorrect passcode</div>
      </div>

      <button class="btn-primary" id="joinBtn">Join Room</button>
      <div class="err-msg" id="joinErr" style="text-align:center;"></div>
    </div>
  </div>

  <!-- =========================================================
       SCREEN 2 — LIVE ROOM
       ========================================================= -->
  <div class="screen" id="liveScreen">

    <!-- LAYER 5 — HOST -->
    <div class="layer-video" id="layerVideo">
      <img class="host-img bob" id="hostImg" alt="">
      <div class="mouth" id="mouth"></div>
    </div>
    <div class="video-fade"></div>

    <!-- LAYER 9 — TOP BAR -->
    <div class="layer-top">
      <div class="live-badge"><span class="dot"></span>LIVE</div>
      <div class="top-right">
        <div class="viewers">
          <svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9 4.5-9 7s4 7 9 7 9-4.5 9-7-4-7-9-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
          <span id="viewerCount">1</span>
        </div>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>
    </div>

    <!-- GUESTS STRIP -->
    <div class="guests-strip" id="guestsStrip"></div>

    <!-- HOST INFO -->
    <div class="host-info">
      <div class="host-name">
        <span id="hostName">Host</span>
        <span class="verified">✓</span>
      </div>
      <div class="host-meta" id="hostMeta">— • —</div>
      <div class="host-pitch" id="hostPitch"></div>
    </div>

    <!-- CAPTION -->
    <div class="caption" id="caption"></div>

    <!-- LAYER 10 — CHAT -->
    <div class="layer-chat" id="chatScroll"></div>

    <!-- ADMIN CONTROL BAR -->
    <div class="admin-bar" id="adminBar">
      <span class="admin-label">Admin</span>
      <button class="admin-btn speak" id="speakBtn">🎤 Speak next line</button>
      <button class="admin-btn" id="greetBtn">👋 Greet user</button>
      <button class="admin-btn end" id="endRoomBtn">⏹ End room</button>
    </div>

    <!-- LAYER 11 — ACTION BAR -->
    <div class="layer-actions">
      <input class="action-input" id="chatInput" placeholder="Say something..." maxlength="200">
      <button class="icon-btn gift" id="giftBtn">
        🎁
        <span class="badge" id="giftCount">0</span>
      </button>
      <button class="icon-btn" id="likeBtn">❤️</button>
    </div>

    <!-- NOTICE OVERLAY -->
    <div class="notice" id="noticeScreen">
      <div class="notice-icon" id="noticeIcon">⏹</div>
      <div class="notice-title" id="noticeTitle">Session ended</div>
      <div class="notice-sub" id="noticeSub">The host ended this session.</div>
      <button class="notice-btn" id="noticeBtn">Back to home</button>
    </div>

    <!-- LOADING -->
    <div class="loading" id="loadingScreen">
      <div class="spinner"></div>
      <div>Joining room...</div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SUPABASE_URL  = 'https://isoautwpyzaquawyzbbv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzb2F1dHdweXphcXVhd3l6YmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjYyMzUsImV4cCI6MjEwNTA0MjIzNX0.GpdO1B6aR_oOfwmnDbs3kBLvUVkRsZhJMGhcIXJx7RQ';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);

/* =========================================================
   STATE
   ========================================================= */
let room = null;            // the room object
let host = null;            // the member object
let isAdmin = false;        // admin mode?
let me = null;              // { type: 'admin'|'guest', name, token, id }
let scriptLines = [];
let scriptIndex = 0;
let realtimeChannel = null;
let guestPollTimer = null;
let heartbeatTimer = null;
let giftCount = 0;
let pendingGreet = null;    // name of last joined guest for greeting
let voices = [];
let mouthX = 50, mouthY = 62, mouthW = 44, mouthH = 20;

/* =========================================================
   INIT
   ========================================================= */
(async () => {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

  // URL params
  const params = new URLSearchParams(window.location.search);
  const roomCode = params.get('room');
  const adminFlag = params.get('admin') === '1';

  if(!roomCode){
    showNotice('❌','Invalid link','This invite link is missing a room code.', 'Go home');
    return;
  }

  // Fetch room
  const { data: roomData, error: roomErr } = await sb
    .from('rooms')
    .select('*, members(*)')
    .eq('code', roomCode)
    .maybeSingle();

  if(roomErr || !roomData){
    showNotice('❌','Room not found','This room does not exist or the invite link is wrong.', 'Go home');
    return;
  }

  if(!roomData.is_active){
    showNotice('⏹','Session ended','This room is no longer active.', 'Go home');
    return;
  }

  // Expired?
  if(roomData.expires_at && new Date(roomData.expires_at) < new Date()){
    showNotice('⏰','Invite expired','This invite link has expired.', 'Go home');
    return;
  }

  room = roomData;
  host = roomData.members;
  scriptLines = (host?.script || '').split('\n').map(s=>s.trim()).filter(Boolean);

  if(adminFlag && roomCode){
    // Admin path — check session, skip form
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ window.location.href = 'admin-login.html'; return; }

    const { data: profile } = await sb.from('profiles')
      .select('role, full_name').eq('id', session.user.id).maybeSingle();

    if(!profile || profile.role !== 'admin'){
      await sb.auth.signOut();
      window.location.href = 'admin-login.html';
      return;
    }

    isAdmin = true;
    me = {
      type: 'admin',
      name: profile.full_name || 'Admin',
      token: 'admin-' + session.user.id,
      id: session.user.id
    };

    enterRoom();
    return;
  }

  // Guest path — show join form
  $('joinRoomCode').innerHTML = `Room: <b>${escapeHtml(room.code)}</b>`;
  $('joinScreen').classList.add('on');
  $('liveScreen').classList.remove('on');
})();

function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  if(!voices.length) voices = speechSynthesis.getVoices();
}

/* =========================================================
   JOIN FORM
   ========================================================= */
$('joinBtn').addEventListener('click', async () => {
  const name = $('jName').value.trim();
  const age = parseInt($('jAge').value, 10);
  const location = $('jLocation').value.trim();
  const passcode = $('jPasscode').value.trim();

  clearJoinErrors();

  let ok = true;
  if(!name){ $('errName').classList.add('on'); ok = false; }
  if(!age || age < 13 || age > 120){ $('errAge').classList.add('on'); ok = false; }
  if(!location){ $('errLocation').classList.add('on'); ok = false; }
  if(!passcode){ $('errPasscode').classList.add('on'); ok = false; }
  if(!ok) return;

  if(passcode !== room.passcode){
    $('errPasscode').textContent = 'Incorrect passcode';
    $('errPasscode').classList.add('on');
    return;
  }

  // Check max users
  const { count } = await sb
    .from('guests')
    .select('*', { count: 'exact', head: true })
    .eq('room_id', room.id)
    .eq('is_kicked', false);

  if(count >= (room.max_users || 20)){
    $('joinErr').textContent = 'This room is full. Try again later.';
    $('joinErr').classList.add('on');
    return;
  }

  const btn = $('joinBtn');
  btn.disabled = true; btn.textContent = 'Joining...';

  const token = 'g-' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);

  const { data: guest, error: guestErr } = await sb.from('guests').insert({
    room_id: room.id,
    full_name: name,
    age,
    location,
    session_token: token,
    is_kicked: false
  }).select().single();

  if(guestErr){
    btn.disabled = false; btn.textContent = 'Join Room';
    $('joinErr').textContent = guestErr.message;
    $('joinErr').classList.add('on');
    return;
  }

  me = { type: 'guest', name, token, id: guest.id };
  sessionStorage.setItem('ll_guest_token', token);

  // System message
  await sb.from('messages').insert({
    room_id: room.id,
    sender_type: 'system',
    sender_name: 'System',
    text: `${name} joined the room`
  });

  // Save for greeting
  pendingGreet = name;

  btn.disabled = false; btn.textContent = 'Join Room';
  enterRoom();
});

function clearJoinErrors(){
  ['errName','errAge','errLocation','errPasscode','joinErr'].forEach(id => $(id).classList.remove('on'));
  ['jName','jAge','jLocation','jPasscode'].forEach(id => $(id).classList.remove('err'));
}

/* =========================================================
   ENTER ROOM
   ========================================================= */
function enterRoom(){
  $('joinScreen').classList.remove('on');
  $('liveScreen').classList.add('on');
  $('loadingScreen').classList.add('on');

  // Render host
  $('hostName').textContent = host?.name || 'Host';
  $('hostMeta').textContent = [host?.age, host?.location].filter(Boolean).join(' • ') || '— • —';
  $('hostPitch').textContent = host?.pitch ? `"${host.pitch}"` : '';
  $('hostImg').src = host?.photo_url || 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#2a0010"/><text x="50%" y="50%" font-size="22" fill="#fff" text-anchor="middle" font-family="sans-serif">No photo</text></svg>'
  );

  // Admin bar
  if(isAdmin) $('adminBar').classList.add('on');

  // Position mouth after a tick
  setTimeout(positionMouth, 100);
  window.addEventListener('resize', positionMouth);

  // Start everything
  loadRecentMessages();
  subscribeToMessages();
  subscribeToRoomStatus();
  startGuestListRefresh();
  startHeartbeat();
  updateViewerCount();

  setTimeout(() => $('loadingScreen').classList.remove('on'), 400);
}

/* =========================================================
   MOUTH POSITION
   ========================================================= */
function positionMouth(){
  const stage = $('layerVideo');
  const w = stage.clientWidth, h = stage.clientHeight;
  const m = $('mouth');
  m.style.left = (mouthX/100*w - mouthW/2) + 'px';
  m.style.top  = (mouthY/100*h - mouthH/2) + 'px';
  m.style.width = mouthW + 'px';
  m.style.height = mouthH + 'px';
}

/* =========================================================
   TALKING
   ========================================================= */
function speakText(text, onDone){
  if(!text){ if(onDone) onDone(); return; }
  const mouth = $('mouth');
  const cap = $('caption');
  cap.textContent = text;
  cap.classList.add('on');

  const u = new SpeechSynthesisUtterance(text);
  const v = voices[Math.floor(Math.random() * voices.length)];
  if(v) u.voice = v;
  u.rate = 1;
  u.pitch = 1.05;

  u.onstart = () => mouth.classList.add('on','talking');
  u.onend = () => {
    mouth.classList.remove('talking');
    setTimeout(() => cap.classList.remove('on'), 400);
    if(onDone) onDone();
  };
  u.onerror = () => {
    mouth.classList.remove('talking');
    if(onDone) onDone();
  };
  speechSynthesis.speak(u);
}

/* =========================================================
   CHAT — LOAD RECENT + SUBSCRIBE
   ========================================================= */
async function loadRecentMessages(){
  const { data } = await sb
    .from('messages')
    .select('*')
    .eq('room_id', room.id)
    .order('created_at', { ascending: false })
    .limit(30);

  if(data){
    data.reverse().forEach(m => appendMessage(m, false));
  }
}

function subscribeToMessages(){
  realtimeChannel = sb
    .channel('room-' + room.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${room.id}` },
      payload => {
        appendMessage(payload.new, true);
      }
    )
    .subscribe();
}

function appendMessage(m, animate){
  const c = $('chatScroll');
  const d = document.createElement('div');
  d.className = 'msg';

  if(m.sender_type === 'system'){
    d.className = 'msg system';
    d.innerHTML = `<div class="body">${escapeHtml(m.text)}</div>`;
  } else {
    if(m.sender_type === 'admin') d.classList.add('admin');
    if(m.sender_type === 'host') d.classList.add('host');

    const initial = (m.sender_name || '?')[0];
    const avClass = m.sender_type === 'admin' ? 'avatar admin'
                  : m.sender_type === 'host' ? 'avatar host'
                  : 'avatar';
    d.innerHTML = `
      <div class="${avClass}">${escapeHtml(initial)}</div>
      <div class="body">
        <span class="name">${escapeHtml(m.sender_name || 'Guest')}</span>
        ${escapeHtml(m.text)}
      </div>`;
  }
  c.appendChild(d);
  while(c.children.length > 8) c.removeChild(c.firstChild);

  if(animate) d.scrollIntoView({behavior:'smooth', block:'end'});
}

/* =========================================================
   SEND MESSAGE
   ========================================================= */
$('chatInput').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  const text = e.target.value.trim();
  if(!text) return;
  e.target.value = '';

  await sb.from('messages').insert({
    room_id: room.id,
    sender_type: isAdmin ? 'admin' : 'guest',
    sender_name: me.name,
    sender_token: me.token,
    text
  });
});

/* =========================================================
   GUEST LIST — who's in the room
   ========================================================= */
async function startGuestListRefresh(){
  await refreshGuestList();
  guestPollTimer = setInterval(refreshGuestList, 5000);
}

async function refreshGuestList(){
  const { data } = await sb
    .from('guests')
    .select('id, full_name, is_kicked')
    .eq('room_id', room.id)
    .eq('is_kicked', false);

  const strip = $('guestsStrip');
  strip.innerHTML = '';

  if(isAdmin){
    const chip = document.createElement('span');
    chip.className = 'guest-chip admin';
    chip.textContent = '👑 ' + me.name;
    strip.appendChild(chip);
  }

  (data || []).forEach(g => {
    const chip = document.createElement('span');
    chip.className = 'guest-chip';
    chip.textContent = g.full_name;
    strip.appendChild(chip);
  });

  // Update viewer count = admins(1 if admin in room) + guests
  const totalGuests = (data || []).length;
  $('viewerCount').textContent = totalGuests + 1; // +1 for host
}

async function updateViewerCount(){
  await refreshGuestList();
}

/* =========================================================
   HEARTBEAT — keep guest marked as active
   ========================================================= */
function startHeartbeat(){
  if(!me || me.type !== 'guest') return;
  heartbeatTimer = setInterval(async () => {
    await sb.from('guests')
      .update({ last_seen: new Date().toISOString() })
      .eq('session_token', me.token);
  }, 30000);
}

/* =========================================================
   ROOM STATUS — end detection
   ========================================================= */
function subscribeToRoomStatus(){
  sb.channel('room-status-' + room.id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${room.id}` },
      payload => {
        if(payload.new.is_active === false){
          showNotice('⏹','Session ended','The host ended this session.', 'Back to home');
        }
      }
    )
    .subscribe();
}

/* =========================================================
   ADMIN CONTROLS
   ========================================================= */
$('speakBtn').addEventListener('click', () => {
  if(!isAdmin) return;
  if(!scriptLines.length){
    speakText('This host has no script yet.');
    return;
  }
  const line = scriptLines[scriptIndex % scriptLines.length];
  scriptIndex++;
  speakText(line);
});

$('greetBtn').addEventListener('click', () => {
  if(!isAdmin) return;
  if(!pendingGreet){
    speakText('Hi everyone, welcome to the room.');
    return;
  }
  const name = pendingGreet;
  pendingGreet = null;
  speakText(`Hi ${name}, welcome to the room.`);
});

$('endRoomBtn').addEventListener('click', async () => {
  if(!isAdmin) return;
  if(!confirm('End this room for everyone?')) return;
  await sb.from('rooms').update({ is_active: false }).eq('id', room.id);
  showNotice('⏹','Session ended','You ended this session.', 'Back to admin');
});

/* =========================================================
   GUEST CONTROLS — gift, like, close
   ========================================================= */
$('giftBtn').addEventListener('click', () => {
  const area = $('app');
  for(let i=0;i<8;i++){
    setTimeout(() => {
      const g = document.createElement('div');
      g.className = 'gift-float';
      g.textContent = ['🎁','💎','🌹','💖'][i%4];
      g.style.left = (5 + Math.random()*75) + '%';
      g.style.bottom = '100px';
      area.appendChild(g);
      setTimeout(() => g.remove(), 3000);
    }, i*90);
  }
  giftCount++;
  $('giftCount').textContent = giftCount;
});

$('likeBtn').addEventListener('click', () => {
  const area = $('app');
  for(let i=0;i<5;i++){
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = '❤️';
      h.style.right = (20 + Math.random()*40) + 'px';
      h.style.bottom = '90px';
      area.appendChild(h);
      setTimeout(() => h.remove(), 1800);
    }, i*70);
  }
});

$('closeBtn').addEventListener('click', () => {
  if(isAdmin){
    window.close();
    // fallback if window.close blocked
    setTimeout(() => { window.location.href = 'admin-panel.html'; }, 100);
  } else {
    if(confirm('Leave this room?')) window.location.href = 'index.html';
  }
});

/* =========================================================
   NOTICE + HELPERS
   ========================================================= */
function showNotice(icon, title, sub, btnText){
  $('noticeIcon').textContent = icon;
  $('noticeTitle').textContent = title;
  $('noticeSub').textContent = sub;
  $('noticeBtn').textContent = btnText || 'OK';
  $('noticeScreen').classList.add('on');
  speechSynthesis.cancel();
}
$('noticeBtn').addEventListener('click', () => {
  window.location.href = isAdmin ? 'admin-panel.html' : 'index.html';
});

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =========================================================
   CLEANUP
   ========================================================= */
window.addEventListener('beforeunload', () => {
  speechSynthesis.cancel();
  clearInterval(guestPollTimer);
  clearInterval(heartbeatTimer);
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
});
</script>
