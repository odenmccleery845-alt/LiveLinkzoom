<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Live Room — LiveLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#000;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff;overflow:hidden;}

.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;max-height:932px;margin:0 auto;background:#000;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:10;}
.screen.on{display:flex;}

/* =========================================================
   JOIN FORM
   ========================================================= */
#joinScreen{
  align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,45,120,0.2),transparent 55%),
    radial-gradient(circle at 70% 80%,rgba(139,92,246,0.25),transparent 55%),
    #0a0a0f;
  overflow-y:auto;
}
.join-card{
  width:100%;max-width:400px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;padding:26px;
  display:flex;flex-direction:column;gap:14px;
}
.invite-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  padding:5px 12px;border-radius:100px;
  font-size:10px;font-weight:900;letter-spacing:1px;
  margin:0 auto 6px;box-shadow:0 0 20px rgba(255,45,120,0.5);
}
.join-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;text-align:center;}
.join-sub{font-size:13px;color:rgba(255,255,255,0.5);text-align:center;font-weight:500;margin-bottom:4px;line-height:1.5;}
.join-sub b{color:#ff2d78;font-weight:800;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.5);}
.field input{
  padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-family:inherit;font-size:15px;
  outline:none;transition:border-color 0.2s;
}
.field input:focus{border-color:#ff2d78;}
.field input.err{border-color:#ef4444;}
.err-msg{font-size:12px;color:#ef4444;font-weight:600;margin-top:2px;display:none;}
.err-msg.on{display:block;}
.btn-primary{
  padding:15px;border-radius:100px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:15px;font-weight:800;letter-spacing:0.3px;
  cursor:pointer;box-shadow:0 8px 28px rgba(255,45,120,0.4);
  transition:transform 0.15s;margin-top:6px;
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

/* =========================================================
   JOIN CARD
   ========================================================= */
#joinCard{
  position:absolute;inset:0;z-index:80;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.82);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
#joinCard.on{display:flex;animation:fadeIn 0.3s ease;}
#joinCard.fadeOut{animation:fadeOut 0.45s ease forwards;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeOut{to{opacity:0;}}

.jc-card{
  width:calc(100% - 40px);max-width:360px;
  background:linear-gradient(180deg,rgba(30,15,25,0.95),rgba(15,5,15,0.98));
  border:1px solid rgba(255,255,255,0.12);
  border-radius:32px;
  padding:30px 22px 24px;
  text-align:center;
  box-shadow:0 24px 72px rgba(0,0,0,0.7),0 0 60px rgba(255,45,120,0.15);
  animation:cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;
  overflow:hidden;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
}
.jc-card::before{
  content:"";position:absolute;top:-40%;left:-40%;
  width:180%;height:180%;
  background:conic-gradient(from 0deg,transparent,rgba(255,45,120,0.08),transparent,rgba(139,92,246,0.08),transparent);
  animation:rotate 12s linear infinite;
  pointer-events:none;
}
@keyframes rotate{to{transform:rotate(360deg);}}
@keyframes cardPop{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}

.jc-avatar-wrap{
  position:relative;
  width:120px;height:120px;
  margin:0 auto 16px;
  z-index:2;
}
.jc-avatar-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ff2d78,#8b5cf6,#ff2d78);
  animation:ringSpin 4s linear infinite;
  padding:4px;
  box-shadow:0 0 40px rgba(255,45,120,0.5);
}
@keyframes ringSpin{to{transform:rotate(360deg);}}
.jc-avatar-inner{
  position:absolute;inset:4px;border-radius:50%;
  background:#000;overflow:hidden;
}
.jc-avatar-inner img{width:100%;height:100%;object-fit:cover;}

.jc-name{
  font-size:20px;font-weight:900;letter-spacing:-0.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:6px;position:relative;z-index:2;
}
.jc-verified{
  width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;
}
.jc-meta{
  font-size:13px;color:rgba(255,255,255,0.55);
  margin-bottom:16px;position:relative;z-index:2;
  font-weight:500;
}

.jc-live-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:18px;position:relative;z-index:2;
}
.jc-live-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff2d78,#ff5c2d);
  padding:5px 12px;border-radius:100px;
  font-size:11px;font-weight:900;letter-spacing:0.6px;
  box-shadow:0 0 18px rgba(255,45,120,0.7);
}
.jc-live-pill .dot{
  width:6px;height:6px;border-radius:50%;background:#fff;
  animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.jc-viewers{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.1);
  padding:5px 12px;border-radius:100px;
  font-size:12px;font-weight:700;
}
.jc-viewers svg{width:13px;height:13px;fill:#fff;}

.jc-welcome-line{
  font-size:14px;color:rgba(255,255,255,0.75);
  line-height:1.5;margin-bottom:20px;
  position:relative;z-index:2;
}
.jc-welcome-line b{color:#ff2d78;font-weight:800;}

.jc-enter-btn{
  width:100%;padding:16px;border-radius:100px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;box-shadow:0 10px 28px rgba(255,45,120,0.45);
  font-family:inherit;letter-spacing:0.3px;
  position:relative;z-index:2;
  transition:transform 0.15s;
}
.jc-enter-btn:active{transform:scale(0.97);}

/* =========================================================
   LIVE ROOM
   ========================================================= */
#liveScreen{background:#000;}

.video-grid{
  position:absolute;top:0;left:0;right:0;height:60%;
  z-index:5;display:grid;gap:2px;background:#000;overflow:hidden;
}
.video-grid.g-1{grid-template-columns:1fr;}
.video-grid.g-2{grid-template-columns:1fr 1fr;}
.video-grid.g-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.video-grid.g-3 .tile:first-child{grid-column:1 / span 2;}
.video-grid.g-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.video-grid.g-5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}
.video-grid.g-5 .tile:first-child{grid-column:1 / span 2;}
.video-grid.g-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}

.tile{position:relative;background:#0a0000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.tile-img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;object-fit:contain;width:100%;height:100%;}
.tile-img.bob{animation:bob 3.6s ease-in-out infinite;}
@keyframes bob{
  0%,100%{transform:translate(-50%,-50%) rotate(0deg);}
  25%{transform:translate(-50%,calc(-50% - 3px)) rotate(-0.4deg);}
  50%{transform:translate(-50%,-50%) rotate(0deg);}
  75%{transform:translate(-50%,calc(-50% - 2px)) rotate(0.4deg);}
}
.tile-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.mouth{
  position:absolute;
  background:radial-gradient(ellipse at center,#0a0202 0%,#1a0505 60%,transparent 100%);
  border-radius:50%;transform-origin:center;opacity:0;
  pointer-events:none;box-shadow:inset 0 2px 8px rgba(0,0,0,0.95);
  transition:opacity 0.12s;
}
.mouth.on{opacity:1;}
.mouth.talking{animation:mouthTalk 0.13s steps(2,end) infinite;}
@keyframes mouthTalk{
  0%{transform:scaleY(0.15);}
  50%{transform:scaleY(1);}
  100%{transform:scaleY(0.15);}
}
.tile-label{
  position:absolute;bottom:6px;left:6px;
  display:flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:100px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:10.5px;font-weight:700;color:#fff;z-index:3;
  max-width:fit-content;
}
.tile-label.host{background:linear-gradient(135deg,rgba(255,45,120,0.85),rgba(139,92,246,0.85));}
.tile-label .mic{
  width:10px;height:10px;border-radius:50%;
  background:#22c55e;display:inline-block;position:relative;
}
.tile-label .mic.muted{background:#6b7280;}

.video-fade{
  position:absolute;left:0;right:0;height:60%;
  top:0;z-index:6;pointer-events:none;
  background:linear-gradient(to bottom,transparent 62%,rgba(0,0,0,0.7) 100%);
}

/* =========================================================
   TOP BAR
   ========================================================= */
.top-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:12px 12px;
  padding-top:max(12px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);
  pointer-events:none;
}
.top-bar > *{pointer-events:auto;}
.tb-left{display:flex;align-items:center;gap:6px;}
.tb-right{display:flex;align-items:center;gap:6px;}

.live-badge{
  display:flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,#ff2d78,#ff5c2d);
  padding:4px 10px;border-radius:100px;
  font-size:10.5px;font-weight:900;letter-spacing:0.6px;
  box-shadow:0 0 14px rgba(255,45,120,0.6);
}
.live-badge .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;}

.viewer-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  padding:4px 10px;border-radius:100px;
  font-size:10.5px;font-weight:800;cursor:pointer;
  transition:background 0.15s;
}
.viewer-pill:hover{background:rgba(255,255,255,0.12);}
.viewer-pill svg{width:11px;height:11px;fill:#fff;}
.viewer-pill .num{font-variant-numeric:tabular-nums;}

.icon-btn-sm{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* =========================================================
   CAPTION
   ========================================================= */
.caption{
  position:absolute;left:50%;top:calc(60% - 56px);transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7px 14px;border-radius:18px;
  font-size:12.5px;font-weight:600;line-height:1.35;
  max-width:calc(100% - 40px);text-align:center;
  opacity:0;transition:opacity 0.25s;z-index:12;
  pointer-events:none;
}
.caption.on{opacity:1;}

/* =========================================================
   CHAT
   ========================================================= */
.chat-layer{
  position:absolute;left:10px;right:76px;
  bottom:calc(40% + 8px);
  max-height:42vh;
  z-index:11;
  overflow-y:scroll;overflow-x:hidden;
  overflow-anchor:none;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  pointer-events:none;
  mask-image:linear-gradient(to top,transparent 0%,#000 22%);
  -webkit-mask-image:linear-gradient(to top,transparent 0%,#000 22%);
}
.chat-layer::-webkit-scrollbar{display:none;}
.chat-inner{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%;}

.msg{
  position:relative;display:flex;align-items:center;
  padding:4px 6px;word-break:break-word;
  animation:msgIn 0.35s ease;
  flex-shrink:0;
}
.msg .avatar{
  width:24px;height:24px;border-radius:50%;flex:0 0 24px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#fff;
  margin-right:8px;
  text-transform:uppercase;
  border:1px solid rgba(255,255,255,0.2);
}
.msg .avatar.admin{background:linear-gradient(135deg,#f59e0b,#ef4444);}
.msg .avatar.host{background:linear-gradient(135deg,#22c55e,#16a34a);}
.msg .body{
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:5px 10px;border-radius:14px;
  font-size:12.5px;line-height:1.35;
  max-width:100%;
}
.msg .name{color:#ff8bb8;font-weight:700;margin-right:4px;}
.msg.admin .name{color:#fbbf24;}
.msg.host .name{color:#4ade80;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* =========================================================
   JOIN TOAST
   ========================================================= */
.join-toast-stack{
  position:absolute;left:10px;bottom:calc(42% + 6px);
  z-index:14;display:flex;flex-direction:column-reverse;gap:4px;
  pointer-events:none;
}
.join-toast{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(255,45,120,0.9),rgba(139,92,246,0.9));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:6px 12px;border-radius:100px;
  font-size:11.5px;font-weight:700;
  color:#fff;
  box-shadow:0 4px 16px rgba(255,45,120,0.4);
  max-width:fit-content;
  opacity:0;transform:translateY(8px);
  animation:joinToast 2.8s ease forwards;
}
@keyframes joinToast{
  0%{opacity:0;transform:translateY(8px) scale(0.9);}
  12%{opacity:1;transform:translateY(0) scale(1);}
  75%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-6px) scale(0.95);}
}

/* =========================================================
   ACTION BAR — TWO ROWS, PHONE-FRIENDLY
   ========================================================= */
.action-wrap{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,0.95) 40%,transparent);
  display:flex;flex-direction:column;gap:8px;
}

/* ROW 1 — chat input (full width) */
.chat-input-row{
  display:flex;align-items:center;gap:8px;
  width:100%;
}
.action-input{
  flex:1;height:40px;border-radius:100px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:13.5px;
  padding:0 16px;outline:none;font-family:inherit;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  min-width:0;
}
.action-input::placeholder{color:rgba(255,255,255,0.5);}

.send-btn{
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ROW 2 — action buttons, evenly spread */
.action-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;
  padding:0 4px;
}
.icon-btn{
  flex:1;
  height:44px;border-radius:14px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform 0.15s,background 0.15s,box-shadow 0.15s;
  position:relative;
  font-family:inherit;
  font-weight:700;
  padding:0 8px;
  min-width:0;
}
.icon-btn .lbl{
  font-size:11px;font-weight:700;letter-spacing:0.2px;
}
.icon-btn:active{transform:scale(0.96);}
.icon-btn.gift{
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border-color:transparent;
  box-shadow:0 4px 16px rgba(255,45,120,0.4);
}
.icon-btn.gift .badge{
  position:absolute;top:-4px;right:-2px;
  min-width:18px;height:18px;border-radius:100px;
  background:#fff;color:#ff2d78;
  font-size:9.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;
  border:2px solid #000;
}
.icon-btn.camera.on{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  border-color:transparent;
  box-shadow:0 0 16px rgba(34,197,94,0.6);
}
.icon-btn.camera.loading{
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  border-color:transparent;
  animation:cameraPulse 1s infinite;
}
@keyframes cameraPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.icon-btn.mic.on{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  border-color:transparent;
  box-shadow:0 0 16px rgba(34,197,94,0.5);
}

/* =========================================================
   ADMIN BAR
   ========================================================= */
.admin-bar{
  display:none;
  position:absolute;left:0;right:0;
  bottom:calc(112px + env(safe-area-inset-bottom));
  z-index:19;
  padding:7px 10px;
  background:linear-gradient(to top,rgba(20,0,10,0.95),rgba(0,0,0,0.6));
  border-top:1px solid rgba(255,45,120,0.25);
  gap:6px;align-items:center;flex-wrap:wrap;
}
.admin-bar.on{display:flex;}
.admin-label{
  font-size:9px;font-weight:900;letter-spacing:1px;
  color:#ff2d78;text-transform:uppercase;padding:0 4px 0 2px;
}
.admin-btn{
  padding:6px 11px;border-radius:100px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;
  transition:background 0.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.admin-btn:hover{background:rgba(255,45,120,0.2);border-color:rgba(255,45,120,0.4);}
.admin-btn.speak{background:linear-gradient(135deg,#ff2d78,#8b5cf6);border-color:transparent;box-shadow:0 4px 12px rgba(255,45,120,0.35);}
.admin-btn.end{background:rgba(239,68,68,0.2);color:#f87171;border-color:rgba(239,68,68,0.4);}

/* =========================================================
   VIEWER DRAWER
   ========================================================= */
.viewer-drawer{
  position:absolute;left:0;right:0;bottom:0;z-index:90;
  max-height:60vh;
  background:#0e0e14;
  border-top-left-radius:24px;border-top-right-radius:24px;
  transform:translateY(100%);
  transition:transform 0.3s ease;
  display:flex;flex-direction:column;
  border-top:1px solid rgba(255,255,255,0.08);
}
.viewer-drawer.on{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.2);margin:10px auto 6px;}
.drawer-head{padding:8px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;}
.drawer-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;}
.drawer-count{font-size:12px;color:rgba(255,255,255,0.5);font-weight:600;}
.drawer-list{overflow-y:auto;padding:8px 0;flex:1;}
.viewer-row{display:flex;align-items:center;gap:10px;padding:9px 20px;}
.viewer-av{
  width:34px;height:34px;border-radius:50%;flex:0 0 34px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;text-transform:uppercase;
}
.viewer-av.admin{background:linear-gradient(135deg,#f59e0b,#ef4444);}
.viewer-av.host{background:linear-gradient(135deg,#22c55e,#16a34a);}
.viewer-info{flex:1;min-width:0;}
.viewer-name{font-size:13.5px;font-weight:700;}
.viewer-role{font-size:11px;color:rgba(255,255,255,0.45);}

/* =========================================================
   NOTICE
   ========================================================= */
.notice{
  position:absolute;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:rgba(5,0,0,0.97);padding:32px;text-align:center;
}
.notice.on{display:flex;}
.notice-icon{font-size:56px;}
.notice-title{font-size:22px;font-weight:900;letter-spacing:-0.4px;}
.notice-sub{font-size:14px;color:rgba(255,255,255,0.5);max-width:300px;line-height:1.55;}
.notice-btn{
  margin-top:8px;padding:12px 24px;border-radius:100px;
  background:linear-gradient(135deg,#ff2d78,#8b5cf6);
  border:none;color:#fff;font-size:14px;font-weight:800;
  cursor:pointer;box-shadow:0 6px 20px rgba(255,45,120,0.4);
}

/* =========================================================
   LOADING
   ========================================================= */
.loading{
  position:absolute;inset:0;z-index:70;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;
  background:#000;color:rgba(255,255,255,0.6);font-size:13px;
}
.loading.on{display:flex;}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,0.1);border-top-color:#ff2d78;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* =========================================================
   FLOATING GIFTS/HEARTS
   ========================================================= */
.gift-float{position:absolute;font-size:26px;pointer-events:none;z-index:30;animation:giftUp 3s ease-out forwards;filter:drop-shadow(0 0 6px rgba(255,45,120,0.8));}
@keyframes giftUp{
  0%{opacity:0;transform:translateY(20px) scale(0.6);}
  20%{opacity:1;transform:translateY(0) scale(1.1);}
  80%{opacity:1;transform:translateY(-140px) scale(1);}
  100%{opacity:0;transform:translateY(-190px) scale(0.9);}
}
.heart-float{position:absolute;font-size:22px;pointer-events:none;z-index:30;animation:heartUp 1.8s ease-out forwards;}
@keyframes heartUp{
  0%{opacity:1;transform:translateY(0) scale(0.8);}
  100%{opacity:0;transform:translateY(-180px) scale(1.4);}
}

/* =========================================================
   TOAST
   ========================================================= */
.toast{
  position:absolute;left:50%;
  bottom:calc(130px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,26,0.95);border:1px solid rgba(255,255,255,0.12);
  padding:10px 18px;border-radius:100px;
  font-size:12.5px;font-weight:600;
  z-index:95;opacity:0;transition:all 0.3s;max-width:80%;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.err{border-color:rgba(239,68,68,0.4);color:#f87171;}
.toast.ok{border-color:rgba(34,197,94,0.4);color:#4ade80;}
</style>

<body>

<script>
const SUPABASE_URL  = 'https://isoautwpyzaquawyzbbv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzb2F1dHdweXphcXVhd3l6YmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjYyMzUsImV4cCI6MjEwNTA0MjIzNX0.GpdO1B6aR_oOfwmnDbs3kBLvUVkRsZhJMGhcIXJx7RQ';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);

let room = null, host = null, isAdmin = false, me = null;
let scriptLines = [], scriptIndex = 0;
let realtimeChannel = null, statusChannel = null;
let guestPollTimer = null, heartbeatTimer = null, viewerTickTimer = null;
let currentGuests = [];
let giftCount = 0, pendingGreet = null;
let voices = [];
let myCameraStream = null, myCameraOn = false;
let myMicOn = true;
let baseViewerCount = 357, currentViewerCount = 357;
let seenGuestTokens = new Set();
let mouthX = 50, mouthY = 62, mouthW = 44, mouthH = 20;

let toastTimer = null;
function toast(msg, type='ok'){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============ INIT ============ */
(async () => {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

  const params = new URLSearchParams(window.location.search);
  const roomCode = params.get('room');
  const adminFlag = params.get('admin') === '1';

  if(!roomCode){
    showNotice('❌','Invalid link','This invite link is missing a room code.', 'Go home');
    return;
  }

  const { data: roomData, error: roomErr } = await sb
    .from('rooms').select('*, members(*)').eq('code', roomCode).maybeSingle();

  if(roomErr || !roomData){
    showNotice('❌','Room not found','This room does not exist.', 'Go home'); return;
  }
  if(!roomData.is_active){
    showNotice('⏹','Session ended','This room is no longer active.', 'Go home'); return;
  }
  if(roomData.expires_at && new Date(roomData.expires_at) < new Date()){
    showNotice('⏰','Invite expired','This invite link has expired.', 'Go home'); return;
  }

  room = roomData;
  host = roomData.members;
  scriptLines = (host?.script || '').split('\n').map(s=>s.trim()).filter(Boolean);

  if(adminFlag){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ window.location.href = 'admin-login.html'; return; }
    const { data: profile } = await sb.from('profiles')
      .select('role, full_name').eq('id', session.user.id).maybeSingle();
    if(!profile || profile.role !== 'admin'){
      await sb.auth.signOut();
      window.location.href = 'admin-login.html'; return;
    }
    isAdmin = true;
    me = { type: 'admin', name: profile.full_name || 'Admin', token: 'admin-' + session.user.id, id: session.user.id };
    enterRoom();
    return;
  }

  $('joinRoomCode').innerHTML = `Room: <b>${escapeHtml(room.code)}</b>`;
})();

function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  if(!voices.length) voices = speechSynthesis.getVoices();
}

/* ============ JOIN FORM ============ */
$('joinBtn').addEventListener('click', async () => {
  const name = $('jName').value.trim();
  const age = parseInt($('jAge').value, 10);
  const location = $('jLocation').value.trim();
  const passcode = $('jPasscode').value.trim();

  clearJoinErrors();
  let ok = true;
  if(!name){ $('errName').classList.add('on'); ok = false; }
  if(!age || age < 13 || age > 120){ $('errAge').classList.add('on'); ok = false; }
  if(!location){ $('errLocation').classList.add('on'); ok = false; }
  if(!passcode){ $('errPasscode').classList.add('on'); ok = false; }
  if(!ok) return;

  if(passcode !== room.passcode){
    $('errPasscode').textContent = 'Incorrect passcode';
    $('errPasscode').classList.add('on'); return;
  }

  const { count } = await sb.from('guests').select('*', { count: 'exact', head: true })
    .eq('room_id', room.id).eq('is_kicked', false);
  if(count >= (room.max_users || 20)){
    $('joinErr').textContent = 'This room is full.';
    $('joinErr').classList.add('on'); return;
  }

  const btn = $('joinBtn');
  btn.disabled = true; btn.textContent = 'Joining...';

  const token = 'g-' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);

  const { data: guest, error: guestErr } = await sb.from('guests').insert({
    room_id: room.id, full_name: name, age, location,
    session_token: token, is_kicked: false
  }).select().single();

  if(guestErr){
    btn.disabled = false; btn.textContent = 'Join Room';
    $('joinErr').textContent = guestErr.message;
    $('joinErr').classList.add('on'); return;
  }

  me = { type: 'guest', name, token, id: guest.id };
  sessionStorage.setItem('ll_guest_token', token);
  pendingGreet = name;

  btn.disabled = false; btn.textContent = 'Join Room';
  showJoinCard(name);
});

function clearJoinErrors(){
  ['errName','errAge','errLocation','errPasscode','joinErr'].forEach(id => $(id).classList.remove('on'));
  ['jName','jAge','jLocation','jPasscode'].forEach(id => $(id).classList.remove('err'));
}

/* ============ JOIN CARD ============ */
function showJoinCard(guestName){
  $('joinScreen').classList.remove('on');
  $('liveScreen').classList.add('on');

  $('jcAvatar').src = host?.photo_url || 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#2a0010"/><text x="50%" y="55%" font-size="80" fill="#fff" text-anchor="middle" font-family="sans-serif">👤</text></svg>'
  );
  $('jcName').textContent = host?.name || 'Host';
  $('jcMeta').textContent = [host?.age, host?.location].filter(Boolean).join(' • ') || '— • —';
  $('jcGuestName').textContent = guestName;
  $('jcViewers').textContent = baseViewerCount;

  $('joinCard').classList.add('on');
  $('joinCard').classList.remove('fadeOut');

  $('jcEnterBtn').onclick = () => {
    $('joinCard').classList.add('fadeOut');
    setTimeout(() => {
      $('joinCard').classList.remove('on','fadeOut');
      enterRoom();
    }, 420);
  };

  setTimeout(() => {
    if($('joinCard').classList.contains('on') && !$('joinCard').classList.contains('fadeOut')){
      $('joinCard').classList.add('fadeOut');
      setTimeout(() => {
        $('joinCard').classList.remove('on','fadeOut');
        enterRoom();
      }, 420);
    }
  }, 3500);
}

/* ============ ENTER ROOM ============ */
function enterRoom(){
  $('joinScreen').classList.remove('on');
  $('liveScreen').classList.add('on');
  $('loadingScreen').classList.add('on');

  if(isAdmin) $('adminBar').classList.add('on');
  if(myMicOn) $('micBtn').classList.add('on');

  renderGrid();

  setTimeout(() => {
    $('loadingScreen').classList.remove('on');
    positionMouth();
  }, 400);

  window.addEventListener('resize', positionMouth);
  loadRecentMessages();
  subscribeToMessages();
  subscribeToRoomStatus();
  startGuestListRefresh();
  startHeartbeat();
  startViewerTicker();
}

/* ============ VIDEO GRID ============ */
function renderGrid(){
  const grid = $('videoGrid');
  const tiles = [];

  tiles.push({
    id: 'host', type: 'host',
    name: host?.name || 'Host',
    img: host?.photo_url || 'data:image/svg+xml;utf8,'+encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#2a0010"/><text x="50%" y="55%" font-size="40" fill="#666" text-anchor="middle" font-family="sans-serif">Host</text></svg>'
    )
  });

  if(myCameraOn && me){
    tiles.push({ id: 'me', type: me.type, name: me.name, cameraOn: true });
  }

  const n = tiles.length;
  grid.className = 'video-grid g-' + Math.min(n, 6);

  grid.innerHTML = tiles.map(t => {
    if(t.type === 'host'){
      return `
        <div class="tile" data-tile="host">
          <img class="tile-img bob" src="${t.img}" alt="">
          <div class="mouth" id="mouth"></div>
          <div class="tile-label host">🎬 ${escapeHtml(t.name)}</div>
        </div>`;
    }
    if(t.id === 'me'){
      const micClass = myMicOn ? '' : ' muted';
      return `
        <div class="tile" data-tile="me">
          <video class="tile-video" id="myVideo" autoplay playsinline muted></video>
          <div class="tile-label ${t.type==='admin'?'host':''}">${t.type==='admin'?'👑':'👤'} ${escapeHtml(t.name)} (you) <span class="mic${micClass}"></span></div>
        </div>`;
    }
  }).join('');

  if(myCameraOn && myCameraStream){
    const v = $('myVideo');
    if(v){ v.srcObject = myCameraStream; }
  }
  setTimeout(positionMouth, 60);
}

function positionMouth(){
  const tile = document.querySelector('[data-tile="host"]');
  const mouth = $('mouth');
  if(!tile || !mouth) return;
  const w = tile.clientWidth, h = tile.clientHeight;
  mouth.style.left = (mouthX/100*w - mouthW/2) + 'px';
  mouth.style.top  = (mouthY/100*h - mouthH/2) + 'px';
  mouth.style.width = mouthW + 'px';
  mouth.style.height = mouthH + 'px';
}

/* ============ CAMERA ============ */
$('cameraBtn').addEventListener('click', async () => {
  const btn = $('cameraBtn');

  if(myCameraOn){
    if(myCameraStream) myCameraStream.getTracks().forEach(t => t.stop());
    myCameraStream = null;
    myCameraOn = false;
    btn.classList.remove('on');
    renderGrid();
    toast('Camera off');
    return;
  }

  btn.classList.add('loading');

  try {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('Camera not supported');
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    myCameraStream = stream;
    myCameraOn = true;
    btn.classList.remove('loading');
    btn.classList.add('on');
    renderGrid();
    toast('Camera on', 'ok');
  } catch(err){
    btn.classList.remove('loading');
    toast('Allow camera in browser settings', 'err');
  }
});

/* ============ MIC ============ */
$('micBtn').addEventListener('click', () => {
  myMicOn = !myMicOn;
  $('micBtn').classList.toggle('on', myMicOn);
  toast(myMicOn ? 'Mic on' : 'Mic muted');
  if(myCameraOn) renderGrid();
});

/* ============ TALKING ============ */
function speakText(text){
  if(!text) return;
  const mouth = $('mouth'), cap = $('caption');
  if(!mouth || !cap) return;

  cap.textContent = text;
  cap.classList.add('on');

  const u = new SpeechSynthesisUtterance(text);
  const v = voices[Math.floor(Math.random() * voices.length)];
  if(v) u.voice = v;
  u.rate = 1; u.pitch = 1.05;
  u.onstart = () => mouth.classList.add('on','talking');
  u.onend = () => {
    mouth.classList.remove('talking');
    setTimeout(() => cap.classList.remove('on'), 400);
  };
  u.onerror = () => mouth.classList.remove('talking');
  speechSynthesis.speak(u);
}

/* ============ CHAT ============ */
async function loadRecentMessages(){
  const { data } = await sb.from('messages').select('*').eq('room_id', room.id)
    .order('created_at', { ascending: false }).limit(30);
  if(data){
    data.reverse().forEach(m => {
      if(m.sender_type === 'system' && /joined$/i.test(m.text || '')) return;
      appendMessage(m, false);
    });
  }
}

function subscribeToMessages(){
  realtimeChannel = sb.channel('room-' + room.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${room.id}` },
      payload => {
        const m = payload.new;
        if(m.sender_type === 'system' && /joined$/i.test(m.text || '')) return;
        appendMessage(m, true);
      }
    ).subscribe();
}

function appendMessage(m, scroll){
  const inner = $('chatInner');
  const d = document.createElement('div');
  d.className = 'msg';
  if(m.sender_type === 'admin') d.classList.add('admin');
  if(m.sender_type === 'host') d.classList.add('host');

  const initial = (m.sender_name || '?')[0];
  const avClass = m.sender_type === 'admin' ? 'avatar admin'
                : m.sender_type === 'host' ? 'avatar host' : 'avatar';
  d.innerHTML = `
    <div class="${avClass}">${escapeHtml(initial)}</div>
    <div class="body"><span class="name">${escapeHtml(m.sender_name || 'Guest')}</span>${escapeHtml(m.text)}</div>`;
  inner.appendChild(d);

  while(inner.children.length > 40) inner.removeChild(inner.firstChild);

  if(scroll){
    const c = $('chatScroll');
    c.scrollTop = c.scrollHeight;
  }
}

/* ============ JOIN TOAST ============ */
function showJoinToast(name){
  if(me && me.name === name) return;
  if(seenGuestTokens.has(name)) return;
  seenGuestTokens.add(name);

  const stack = $('joinToastStack');
  const d = document.createElement('div');
  d.className = 'join-toast';
  d.innerHTML = `👋 <b>${escapeHtml(name)}</b> joined`;
  stack.appendChild(d);
  setTimeout(() => { if(d.parentNode) d.parentNode.removeChild(d); }, 2900);
}

/* ============ SEND CHAT ============ */
async function sendMessage(){
  const text = $('chatInput').value.trim();
  if(!text) return;
  $('chatInput').value = '';
  await sb.from('messages').insert({
    room_id: room.id,
    sender_type: isAdmin ? 'admin' : 'guest',
    sender_name: me.name,
    sender_token: me.token,
    text
  });
}
$('chatInput').addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
$('sendBtn').addEventListener('click', sendMessage);

/* ============ GUEST LIST ============ */
async function startGuestListRefresh(){
  await refreshGuestList(true);
  guestPollTimer = setInterval(() => refreshGuestList(false), 4000);
}

async function refreshGuestList(isInitial){
  const { data } = await sb.from('guests')
    .select('id, full_name, is_kicked, session_token')
    .eq('room_id', room.id).eq('is_kicked', false);

  const previousTokens = new Set(currentGuests.map(g => g.session_token));
  currentGuests = data || [];

  if(!isInitial){
    currentGuests.forEach(g => {
      if(!previousTokens.has(g.session_token) && g.session_token !== me?.token){
        showJoinToast(g.full_name);
      }
    });
  } else {
    currentGuests.forEach(g => {
      if(g.session_token !== me?.token) seenGuestTokens.add(g.full_name);
    });
  }

  renderDrawer();
}

/* ============ VIEWER TICKER ============ */
function startViewerTicker(){
  setTimeout(() => {
    currentViewerCount = baseViewerCount;
    paintViewerCount();
    viewerTickTimer = setInterval(() => {
      const r = Math.random();
      let delta;
      if(r < 0.60) delta = Math.floor(Math.random() * 6);
      else if(r < 0.85) delta = Math.floor(Math.random() * 18);
      else delta = -Math.floor(Math.random() * 3);
      currentViewerCount += delta;
      if(currentViewerCount < 357) currentViewerCount = 357 + Math.floor(Math.random() * 5);
      paintViewerCount();
    }, 1300);
  }, 600);
}
function paintViewerCount(){
  $('viewerCount').textContent = currentViewerCount;
  $('jcViewers').textContent = currentViewerCount;
}

/* ============ VIEWER DRAWER ============ */
function renderDrawer(){
  const list = $('drawerList');
  const rows = [];
  rows.push({ type:'host', name: host?.name || 'Host', role: 'Host' });
  if(me) rows.push({ type: me.type, name: me.name + ' (you)', role: me.type === 'admin' ? 'Admin' : 'Guest' });
  currentGuests.forEach(g => {
    if(me?.token === g.session_token) return;
    rows.push({ type:'guest', name: g.full_name, role: 'Guest' });
  });
  list.innerHTML = rows.map(r => `
    <div class="viewer-row">
      <div class="viewer-av ${r.type}">${escapeHtml(r.name[0])}</div>
      <div class="viewer-info">
        <div class="viewer-name">${escapeHtml(r.name)}</div>
        <div class="viewer-role">${r.role}</div>
      </div>
    </div>`).join('');
  $('drawerCount').textContent = rows.length + ' in room';
}

$('viewerPill').addEventListener('click', () => {
  $('viewerDrawer').classList.toggle('on');
});
document.addEventListener('click', e => {
  const drawer = $('viewerDrawer');
  if(!drawer.classList.contains('on')) return;
  if(drawer.contains(e.target)) return;
  if($('viewerPill').contains(e.target)) return;
  drawer.classList.remove('on');
});

/* ============ HEARTBEAT ============ */
function startHeartbeat(){
  if(!me || me.type !== 'guest') return;
  heartbeatTimer = setInterval(async () => {
    await sb.from('guests').update({ last_seen: new Date().toISOString() })
      .eq('session_token', me.token);
  }, 30000);
}

/* ============ ROOM STATUS ============ */
function subscribeToRoomStatus(){
  statusChannel = sb.channel('room-status-' + room.id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${room.id}` },
      payload => {
        if(payload.new.is_active === false){
          showNotice('⏹','Session ended','The host ended this session.', 'Back to home');
        }
      }
    ).subscribe();
}

/* ============ ADMIN ============ */
$('speakBtn').addEventListener('click', () => {
  if(!isAdmin) return;
  if(!scriptLines.length){ speakText('This host has no script yet.'); return; }
  speakText(scriptLines[scriptIndex % scriptLines.length]);
  scriptIndex++;
});
$('greetBtn').addEventListener('click', () => {
  if(!isAdmin) return;
  if(!pendingGreet){ speakText('Hi everyone, welcome to the room.'); return; }
  const name = pendingGreet;
  pendingGreet = null;
  speakText(`Hi ${name}, welcome to the room.`);
});
$('endRoomBtn').addEventListener('click', async () => {
  if(!isAdmin) return;
  if(!confirm('End this room for everyone?')) return;
  await sb.from('rooms').update({ is_active: false }).eq('id', room.id);
  showNotice('⏹','Session ended','You ended this session.', 'Back to admin');
});

/* ============ GUEST CONTROLS ============ */
$('giftBtn').addEventListener('click', () => {
  const area = $('app');
  for(let i=0;i<8;i++){
    setTimeout(() => {
      const g = document.createElement('div');
      g.className = 'gift-float';
      g.textContent = ['🎁','💎','🌹','💖'][i%4];
      g.style.left = (5 + Math.random()*75) + '%';
      g.style.bottom = '160px';
      area.appendChild(g);
      setTimeout(() => g.remove(), 3000);
    }, i*90);
  }
  giftCount++;
  $('giftCount').textContent = giftCount;
});
$('likeBtn').addEventListener('click', () => {
  const area = $('app');
  for(let i=0;i<5;i++){
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = '❤️';
      h.style.right = (20 + Math.random()*40) + 'px';
      h.style.bottom = '160px';
      area.appendChild(h);
      setTimeout(() => h.remove(), 1800);
    }, i*70);
  }
});
$('settingsBtn').addEventListener('click', () => toast('Settings coming soon'));
$('closeBtn').addEventListener('click', () => {
  if(isAdmin){
    if(confirm('Leave this room? It stays live for others.')) window.location.href = 'admin-panel.html';
  } else {
    if(confirm('Leave this room?')) window.location.href = 'index.html';
  }
});

/* ============ NOTICE ============ */
function showNotice(icon, title, sub, btnText){
  $('noticeIcon').textContent = icon;
  $('noticeTitle').textContent = title;
  $('noticeSub').textContent = sub;
  $('noticeBtn').textContent = btnText || 'OK';
  $('noticeScreen').classList.add('on');
  speechSynthesis.cancel();
}
$('noticeBtn').addEventListener('click', () => {
  window.location.href = isAdmin ? 'admin-panel.html' : 'index.html';
});

/* ============ CLEANUP ============ */
window.addEventListener('beforeunload', () => {
  speechSynthesis.cancel();
  clearInterval(guestPollTimer);
  clearInterval(heartbeatTimer);
  clearInterval(viewerTickTimer);
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  if(statusChannel) sb.removeChannel(statusChannel);
  if(myCameraStream) myCameraStream.getTracks().forEach(t => t.stop());
});
</script>
</body>
